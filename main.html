<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Небо для Оли ✨</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      overflow: hidden;
      background: radial-gradient(circle at top, #1d2754 0%, #0b1026 45%, #040814 100%);
      color: white;
    }

    .sky {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    .title {
      position: absolute;
      top: 30px;
      width: 100%;
      text-align: center;
      z-index: 5;
      padding: 0 20px;
    }

    .title h1 {
      margin: 0;
      font-size: 32px;
      font-weight: 700;
    }

    .title p {
      margin-top: 10px;
      font-size: 16px;
      opacity: 0.9;
    }

    .star {
      position: absolute;
      width: 22px;
      height: 22px;
      background: white;
      border-radius: 50%;
      box-shadow: 0 0 12px rgba(255,255,255,0.9), 0 0 24px rgba(173,216,255,0.5);
      cursor: pointer;
      animation: twinkle 2.5s infinite ease-in-out;
      transition: transform 0.2s ease;
    }

    .star::before,
    .star::after {
      content: "";
      position: absolute;
      background: rgba(255,255,255,0.95);
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      border-radius: 999px;
    }

    .star::before {
      width: 2px;
      height: 34px;
    }

    .star::after {
      width: 34px;
      height: 2px;
    }

    .star:hover {
      transform: scale(1.18);
    }

    .star.opened {
      background: #ffd1f3;
      box-shadow: 0 0 14px rgba(255,209,243,1), 0 0 26px rgba(255,150,220,0.75);
    }

    .tiny-star {
      position: absolute;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: rgba(255,255,255,0.9);
      animation: twinkle 3s infinite ease-in-out;
    }

    @keyframes twinkle {
      0%, 100% {
        opacity: 0.4;
        transform: scale(0.9);
      }
      50% {
        opacity: 1;
        transform: scale(1.15);
      }
    }

    .shooting-star {
      position: absolute;
      top: 15%;
      left: -200px;
      width: 180px;
      height: 2px;
      background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,1));
      transform: rotate(20deg);
      opacity: 0;
      animation: shooting 8s infinite ease-in-out;
    }

    @keyframes shooting {
      0%, 70%, 100% {
        left: -220px;
        top: 10%;
        opacity: 0;
      }
      72% {
        opacity: 1;
      }
      82% {
        left: 110%;
        top: 35%;
        opacity: 0;
      }
    }

    .message-box {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(90%, 420px);
      background: rgba(12, 16, 35, 0.92);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 20px;
      padding: 24px 20px;
      text-align: center;
      z-index: 20;
      box-shadow: 0 10px 40px rgba(0,0,0,0.45);
      display: none;
      backdrop-filter: blur(8px);
    }

    .message-box.show {
      display: block;
      animation: fadeIn 0.25s ease;
    }

    .message-box h2 {
      margin-top: 0;
      margin-bottom: 12px;
      font-size: 24px;
    }

    .message-box p {
      font-size: 18px;
      line-height: 1.5;
      margin-bottom: 18px;
    }

    .message-box button {
      background: linear-gradient(135deg, #ff8fd8, #ffb6e8);
      color: #1c1030;
      border: none;
      border-radius: 999px;
      padding: 10px 18px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .message-box button:hover {
      opacity: 0.95;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translate(-50%, -46%);
      }
      to {
        opacity: 1;
        transform: translate(-50%, -50%);
      }
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 15;
      display: none;
    }

    .overlay.show {
      display: block;
    }

    .final-star {
      display: none;
      position: absolute;
      left: 50%;
      top: 56%;
      transform: translate(-50%, -50%);
      width: 34px;
      height: 34px;
      background: #fff1a8;
      border-radius: 50%;
      box-shadow: 0 0 18px rgba(255,241,168,1), 0 0 40px rgba(255,220,120,0.95);
      cursor: pointer;
      z-index: 8;
      animation: finalPulse 1.8s infinite ease-in-out;
    }

    .final-star::before,
    .final-star::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255,245,190,0.95);
      border-radius: 999px;
    }

    .final-star::before {
      width: 2px;
      height: 48px;
    }

    .final-star::after {
      width: 48px;
      height: 2px;
    }

    @keyframes finalPulse {
      0%, 100% {
        transform: translate(-50%, -50%) scale(1);
      }
      50% {
        transform: translate(-50%, -50%) scale(1.18);
      }
    }

    .hint {
      display: none;
      position: absolute;
      left: 50%;
      top: calc(56% + 40px);
      transform: translateX(-50%);
      z-index: 8;
      font-size: 15px;
      color: #ffe8f8;
      text-align: center;
      padding: 0 20px;
    }

    .counter {
      position: absolute;
      bottom: 20px;
      width: 100%;
      text-align: center;
      z-index: 5;
      font-size: 15px;
      opacity: 0.85;
      padding: 0 20px;
    }

    @media (max-width: 600px) {
      .title h1 {
        font-size: 26px;
      }

      .title p {
        font-size: 15px;
      }

      .message-box p {
        font-size: 17px;
      }
    }
  </style>
</head>
<body>
  <div class="sky" id="sky">
    <div class="title">
      <h1>Для Оли ✨</h1>
      <p>Нажимай на звёзды — каждая хранит что-то тёплое для тебя 💙</p>
    </div>

    <div class="shooting-star"></div>

    <!-- Главные звёзды -->
    <div class="star" style="top: 23%; left: 18%;" data-id="0"></div>
    <div class="star" style="top: 34%; left: 72%;" data-id="1"></div>
    <div class="star" style="top: 52%; left: 26%;" data-id="2"></div>
    <div class="star" style="top: 44%; left: 52%;" data-id="3"></div>
    <div class="star" style="top: 67%; left: 68%;" data-id="4"></div>
    <div class="star" style="top: 74%; left: 38%;" data-id="5"></div>

    <!-- Финальная звезда -->
    <div class="final-star" id="finalStar"></div>
    <div class="hint" id="finalHint">Самая яркая звезда появилась только для тебя 💛</div>

    <div class="counter" id="counter">Открыто звёзд: 0 из 6</div>
  </div>

  <div class="overlay" id="overlay"></div>

  <div class="message-box" id="messageBox">
    <h2 id="messageTitle">✨</h2>
    <p id="messageText"></p>
    <button id="closeBtn">Закрыть</button>
  </div>

  <script>
    const messages = [
      "Моя сладкая девочка, я тебя люблю больше всего на свете",
      "Я буду тебе гладить ножки, обнимать, играть в бравлик и любить очень очень сильно",
      "Я по тебе очень скучаю...",
      "Я не хочу, чтобы тебе было когда-нибудь грустно или плохо",
      "Ти мой самый роднулькин",
      "Я счастлив, что ты у меня есть..."
    ];

    const stars = document.querySelectorAll(".star");
    const messageBox = document.getElementById("messageBox");
    const messageText = document.getElementById("messageText");
    const messageTitle = document.getElementById("messageTitle");
    const closeBtn = document.getElementById("closeBtn");
    const overlay = document.getElementById("overlay");
    const finalStar = document.getElementById("finalStar");
    const finalHint = document.getElementById("finalHint");
    const counter = document.getElementById("counter");

    let opened = new Set();

    function showMessage(title, text) {
      messageTitle.textContent = title;
      messageText.textContent = text;
      messageBox.classList.add("show");
      overlay.classList.add("show");
    }

    function closeMessage() {
      messageBox.classList.remove("show");
      overlay.classList.remove("show");
    }

    stars.forEach((star, index) => {
      star.addEventListener("click", () => {
        if (!opened.has(index)) {
          opened.add(index);
          star.classList.add("opened");
          counter.textContent = `Открыто звёзд: ${opened.size} из 6`;
        }

        showMessage("Для Оли ✨", messages[index]);

        if (opened.size === stars.length) {
          finalStar.style.display = "block";
          finalHint.style.display = "block";
        }
      });
    });

    finalStar.addEventListener("click", () => {
      showMessage(
        "Самый любимый котик",
        "<3"
      );
    });

    closeBtn.addEventListener("click", closeMessage);
    overlay.addEventListener("click", closeMessage);

    // Мелкие фоновые звёзды
    const sky = document.getElementById("sky");
    for (let i = 0; i < 70; i++) {
      const tinyStar = document.createElement("div");
      tinyStar.classList.add("tiny-star");
      tinyStar.style.top = Math.random() * 100 + "%";
      tinyStar.style.left = Math.random() * 100 + "%";
      tinyStar.style.animationDelay = (Math.random() * 4) + "s";
      tinyStar.style.opacity = (0.3 + Math.random() * 0.7).toFixed(2);
      sky.appendChild(tinyStar);
    }
  </script>
</body>
</html>
